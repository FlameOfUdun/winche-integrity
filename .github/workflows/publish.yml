name: Publish

# Push a tag v<version> (the <Version> in the projects, e.g. v1.0.1) to publish Winche.Integrity and Winche.Integrity.AspNetCore to
# nuget.org. They depend on Winche.Core through nuget.org, so release in order: Winche.Core, then Winche.Integrity, then
# Winche Server and the CLI.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # NuGet trusted publishing (OIDC): no API key is stored
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: The tag matches the version
        run: |
          version=$(dotnet msbuild src/Winche.Integrity/Winche.Integrity.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in the projects ($version)."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Winche.Integrity.slnx

      - name: Build
        run: dotnet build Winche.Integrity.slnx -c Release --no-restore

      # Tests use PostgreSQL in Docker (Testcontainers), which GitHub's Ubuntu runners have.
      - name: Test
        run: dotnet test Winche.Integrity.slnx -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Winche.Integrity/Winche.Integrity.csproj -c Release --no-build -o ./packages
          dotnet pack src/Winche.Integrity.AspNetCore/Winche.Integrity.AspNetCore.csproj -c Release --no-build -o ./packages

      # Exchange the GitHub OIDC token for a short-lived NuGet.org API key.
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: FlameOfUdun

      - name: Push
        run: dotnet nuget push ./packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
